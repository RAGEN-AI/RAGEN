    max_actions_per_traj: 20
    env_instruction: |
      You are solving a 2x2 Rubik's Cube (Pocket Cube). The goal is to restore the cube so that each of the faces consists of a single, unique color.
      Available actions use standard Singmaster notation for face rotations: U, U', D, D', L, L', R, R', F, F', B, B'.
      - Faces: U (Up), D (Down), L (Left), R (Right), F (Front), B (Back).
      - Modifiers: A letter alone means 90° clockwise (e.g., 'R'). A letter with prime (') means 90° counter-clockwise (e.g., "R'").
      Respond with a sequence of actions separated by "||".
      Example: <answer>U</answer>
    max_tokens: 96
    env_config:
      scramble_depth: 1
      max_steps: 20
      render_mode: "text"

  # ── POMDP Sokoban variants (partial observation, memory experiments) ──────────
  # Agent sees only a 3×3 window around itself; must build a mental map in <think>.
  # Compare with full-context / sliding-window / MEM1-style truncation strategies.

  POMDPSokoban:
    env_type: sokoban
    max_actions_per_traj: 50
    env_instruction: |
      You are navigating a Sokoban board. You can only see a 3×3 area around you.
      Goal: push all boxes ( X ) onto targets ( O ). You are P.
      Symbols: # =wall, _ =empty, O =target, X =box, √ =box on target, P =you.

      MEMORY RULE: previous observations are discarded — only your <think> block
      carries forward. Use it to maintain a running map of the 5×5 board.

      In <think>, keep:
        MAP: a 5×5 grid using the same symbols above, ? for unseen cells.
             Update it each turn by filling in the 3×3 patch you currently see.
             Overwrite box positions when a box moves.
        PLAN: one sentence on what you intend to do next.

      After <think>, output exactly ONE action:
      <answer>Up</answer>, <answer>Down</answer>, <answer>Left</answer>, or <answer>Right</answer>.

      KEY RULE: Position (r,c) means your 3×3 view covers MAP rows [r-1,r,r+1] and cols [c-1,c,c+1].
      All other MAP cells stay ? until you visit them. Cells you saw before stay filled even when out of view.

      EXAMPLE — study how the MAP is built and updated across turns:

      Turn 1 | Position: (2,3)
      State:  #  #  #
              _  P  _
              _  X  _
      <think>
      MAP:
      ? # # # ?
      ? _ P _ ?
      ? _ X _ ?
      ? ? ? ? ?
      ? ? ? ? ?
      PLAN: X visible below at (3,3). Push it down to explore lower rows.
      </think><answer>Down</answer>

      Turn 2 | Position: (3,3)
      State:  _  _  _
              _  P  _
              O  X  _
      <think>
      MAP:
      ? # # # ?
      ? _ _ _ ?
      ? _ P _ ?
      ? O X _ ?
      ? ? ? ? ?
      PLAN: Row 1 walls kept from Turn 1 memory (not visible now). O found at (4,2), X just pushed to (4,3). Move right to get behind X and push it left onto O.
      </think><answer>Right</answer>
    max_tokens: 512
    parallel_friendly: false
    max_workers: 32
    env_config:
      dim_x: 5
      dim_y: 5
      num_boxes: 1
      max_steps: 150
      search_depth: 100
      min_solution_steps: null  # null=no filter; set to [1,3] via CLI for easy curriculum
      partial_obs: true
      partial_obs_window: 1
      ignore_gym_reward: true
      success_reward: 1.0
      distance_reward_coeff: 0.3
      no_op_penalty: -0.01

  POMDPSokobanHard:
    env_type: sokoban
    max_actions_per_traj: 80
    env_instruction: |
      You are navigating a Sokoban board. You can only see a 3×3 area around you.
      Goal: push all boxes ( X ) onto targets ( O ). You are P.
      Symbols: # =wall, _ =empty, O =target, X =box, √ =box on target, P =you.

      MEMORY RULE: previous observations are discarded — only your <think> block
      carries forward. Use it to maintain a running map of the 6×6 board.

      In <think>, keep:
        MAP: a 6×6 grid using the same symbols above, ? for unseen cells.
             Update it each turn by filling in the 3×3 patch you currently see.
             Overwrite box positions when a box moves.
        PLAN: one sentence on what you intend to do next.

      After <think>, output exactly ONE action:
      <answer>Up</answer>, <answer>Down</answer>, <answer>Left</answer>, or <answer>Right</answer>.
    max_tokens: 512
    parallel_friendly: false
    max_workers: 32
    env_config:
      dim_x: 6
      dim_y: 6
      num_boxes: 2
      max_steps: 200
      search_depth: 300
      min_solution_steps: null
      partial_obs: true
      partial_obs_window: 1
      ignore_gym_reward: true
      success_reward: 1.0
      distance_reward_coeff: 0.1
      no_op_penalty: -0.01

  LightsOut:
    env_type: lights_out
    max_actions_per_traj: 8
    env_instruction: |
      You are solving the Lights Out puzzle. The board is a square grid of lights.
      A 1 means the light is on and a 0 means the light is off.
      Pressing a cell toggles that cell and its orthogonal neighbors: up, down, left, and right.
      Your goal is to turn every light off.
      Coordinates are zero-indexed. Respond with one action such as <answer>toggle 0 1</answer>.
    max_tokens: 128
    parallel_friendly: false
    max_workers: 32
    env_config:
      size: 3
      scramble_depth: 4
      max_steps: 8
      shaped_reward: true
      success_reward: 1.0
