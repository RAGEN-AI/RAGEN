custom_envs:
  SimpleSokoban:
    env_type: sokoban
    max_actions_per_traj: 10 # used in environment state manager to control the actual max actions executed per trajectory
    env_instruction: |
      You are solving the Sokoban puzzle. 
      You are the player and you need to push all boxes to targets. 
      When you are right next to a box, you can push it by moving in the same direction. 
      You cannot push a box through a wall, and you cannot pull a box. 
      The answer should be a sequence of actions, like <answer>Right || Right || Up</answer>
    max_tokens: 100 # used to curate llm prompt "max words", not used for rollout
    parallel_friendly: false
    max_workers: 32
    env_config: # keys should be a subset of SokobanConfig
      dim_x: 6
      dim_y: 6
      num_boxes: 1
      max_steps: 100

  LargerSokoban:
    env_type: sokoban
    max_actions_per_traj: 10
    env_instruction: |
      You are solving the Sokoban puzzle. 
      You are the player and you need to push all boxes to targets. 
      When you are right next to a box, you can push it by moving in the same direction. 
      You cannot push a box through a wall, and you cannot pull a box. 
      The answer should be a sequence of actions, like <answer>Right || Right || Up</answer>
    max_tokens: 100
    parallel_friendly: false
    max_workers: 32
    env_config:
      dim_x: 8
      dim_y: 8
      num_boxes: 2
      max_steps: 100
      search_depth: 10
  
  SokobanDifferentGridVocab:
    env_type: sokoban
    max_actions_per_traj: 10
    env_instruction: |
      You are solving the Sokoban puzzle. 
      You are the player and you need to push all boxes to targets. 
      When you are right next to a box, you can push it by moving in the same direction. 
      You cannot push a box through a wall, and you cannot pull a box. 
      The answer should be a sequence of actions, like <answer>Right || Right || Up</answer>
    max_tokens: 100
    parallel_friendly: false
    max_workers: 32
    env_config: # keys should be a subset of SokobanConfig
      search_depth: 30
      dim_x: 6
      dim_y: 6
      num_boxes: 1
      max_steps: 100
      grid_lookup: {0: "W", 1: ".", 2: "G", 3: "C", 4: "B", 5: "A", 6: "@"}
      grid_vocab: {"W": "wall", ".": "empty", "G": "target", "C": "box on target", "B": "box", "A": "player", "@": "player on target"}

  CoordSokoban:
    env_type: sokoban
    max_actions_per_traj: 10
    env_instruction: |
      You are solving the Sokoban puzzle. You are the player and you need to push all boxes to targets.
      You are provided with a symbol grid and the zero-indexed coordinates of the player, each box, and each target.
      Row index increases downward (row 0 is the top row), column index increases rightward (col 0 is the leftmost column).
      When you are exactly next to a box, you can push it by moving in the same direction.
      To push a box Down, you must be directly above it (player row < box row). To push a box Up, you must be directly below it (player row > box row). To push a box Right, you must be to its left (player col < box col). To push a box Left, you must be to its right (player col > box col).
      You cannot push a box through a wall, and you cannot pull a box.
      The answer should be a sequence of actions, like <answer>Right || Right || Up</answer>.
      Before every action, read the current state carefully and begin your thinking with the exact coordinates:
      Player: (row, col) | Box: (row, col) | Target: (row, col)
      Then derive your move from these coordinates. Do not rely on memory of previous states.
      Keep <think> under 150 tokens to leave room for <answer>.
    max_tokens: 256
    parallel_friendly: false
    max_workers: 32
    env_config: # keys should be a subset of SokobanConfig
      dim_x: 6
      dim_y: 6
      num_boxes: 1
      max_steps: 100
      observation_format: "grid_coord"
      search_depth: 300            # reduce to ~5 when using min_solution_steps=[1,3]
      distance_reward_coeff: 0.0   # 0.0=disabled; try 0.1~0.5 for shaped reward
      min_solution_steps: null     # null=no filter; set to [1,3] for easy curriculum
      ignore_gym_reward: false     # true = success_reward only; false = use gym reward
      success_reward: 1.0          # reward given on success when ignore_gym_reward=true
      no_op_penalty: 0.0           # penalty per no-op action (player position unchanged)

  VisualSimpleSokoban:
    env_type: sokoban
    max_actions_per_traj: 10
    env_instruction: "You are solving the Sokoban puzzle. You are the player and you need to push all boxes to targets. When you are right next to a box, you can push it by moving in the same direction. You cannot push a box through a wall, and you cannot pull a box. The answer should be a sequence of actions, like <answer>Right || Right || Up</answer>"
    max_tokens: 100
    parallel_friendly: false
    max_workers: 32
    env_config: # keys should be a subset of SokobanConfig
      dim_x: 6
      dim_y: 6
      num_boxes: 1
      max_steps: 100
      render_mode: "rgb_array"

  Alfworld:
    env_type: alfworld
    max_actions_per_traj: 50
    parallel_friendly: false
    max_workers: 1
    env_instruction: |
      You are an expert agent in the ALFRED Embodied Environment.
      Complete household tasks by navigating and interacting with objects.

      You should first reason step-by-step about the current situation. This reasoning process MUST be enclosed within <think> </think> tags.
      Once you've finished your reasoning, you should choose an admissible action for current step and present it within <answer>...</answer> tags.

    max_tokens: 512
    env_config:
      eval_dataset: "eval_in_distribution"

  AlfworldOOD:
    env_type: alfworld
    max_actions_per_traj: 50
    parallel_friendly: false
    max_workers: 1
    env_instruction: |
      You are an expert agent in the ALFRED Embodied Environment.
